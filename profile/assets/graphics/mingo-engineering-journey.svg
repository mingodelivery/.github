<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #24292f; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #57606a; }
    .date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: bold; fill: #e65100; }
    .line { stroke: #d0d7de; stroke-width: 2; }
    .node { fill: #e65100; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #c9d1d9; }
      .desc { fill: #8b949e; }
      .date { fill: #ff9800; }
      .line { stroke: #30363d; }
      .node { fill: #ff9800; }
    }
  </style>
  
  <text x="50" y="40" class="title" style="font-size: 20px;">ENGINEERING THE MINGO NETWORK</text>
  <text x="50" y="65" class="desc">From restaurant commerce foundation to connected delivery platform</text>
  
  <g transform="translate(50, 110)">
    <line x1="10" y1="0" x2="10" y2="200" class="line" />
    <circle cx="10" cy="0" r="6" class="node" />
    <text x="35" y="4" class="date">Jan–Apr 2026</text>
    <text x="120" y="4" class="title">Foundation</text>
    <text x="250" y="4" class="desc">— </text>
    <circle cx="10" cy="50" r="6" class="node" />
    <text x="35" y="54" class="date">May–Jun 2026</text>
    <text x="120" y="54" class="title">Restaurant operations</text>
    <text x="250" y="54" class="desc">— </text>
    <circle cx="10" cy="100" r="6" class="node" />
    <text x="35" y="104" class="date">Jul 2026</text>
    <text x="120" y="104" class="title">Delivery network</text>
    <text x="250" y="104" class="desc">— </text>
    <circle cx="10" cy="150" r="6" class="node" />
    <text x="35" y="154" class="date">Aug 2026</text>
    <text x="120" y="154" class="title">Platform intelligence</text>
    <text x="250" y="154" class="desc">— </text>
    <circle cx="10" cy="200" r="6" class="node" />
    <text x="35" y="204" class="date">Sep–Dec 2026</text>
    <text x="120" y="204" class="title">Continuing expansion</text>
    <text x="250" y="204" class="desc">— </text>
  </g>
</svg>