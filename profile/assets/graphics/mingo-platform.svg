<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <style>
    .title { font-family: -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-family: -apple-system, sans-serif; font-size: 14px; fill: #b0bec5; }
    .box { fill: #1e1e1e; stroke: #333; stroke-width: 2; rx: 8; }
    .box-orange { fill: #2d1806; stroke: #ff6d00; stroke-width: 2; rx: 8; }
    .text-main { font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .text-orange { font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #ff9800; text-anchor: middle; }
    .line { fill: none; stroke: #555; stroke-width: 2; }
    .arrow { fill: #555; }
  </style>
  <rect width="900" height="450" fill="#0d1117" />
  
  <text x="450" y="40" class="title" text-anchor="middle">MINGO COMMERCE NETWORK</text>
  
  <rect x="200" y="90" width="200" height="60" class="box"/>
  <text x="300" y="126" class="text-main">CUSTOMER</text>
  
  <rect x="200" y="170" width="200" height="50" class="box-orange"/>
  <text x="300" y="200" class="text-orange">Mingo Delivery / Store</text>
  
  <rect x="500" y="90" width="200" height="60" class="box"/>
  <text x="600" y="126" class="text-main">RESTAURANT</text>
  
  <rect x="500" y="170" width="200" height="50" class="box-orange"/>
  <text x="600" y="200" class="text-orange">Mingo POS / Kitchen</text>
  
  <path d="M 300 220 L 300 270 L 600 270 L 600 220" class="line" />
  <rect x="400" y="250" width="100" height="40" rx="20" fill="#ff6d00"/>
  <text x="450" y="276" class="text-main">ORDER</text>
  
  <path d="M 450 290 L 450 320" class="line" />
  <polygon points="445,315 455,315 450,325" class="arrow" />
  
  <rect x="350" y="325" width="200" height="50" class="box-orange"/>
  <text x="450" y="355" class="text-orange">Mingo Rider / Delivery</text>
  
  <path d="M 450 375 L 450 405" class="line" />
  <polygon points="445,400 455,400 450,410" class="arrow" />
  
  <rect x="250" y="410" width="400" height="40" class="box"/>
  <text x="450" y="436" class="text-main" style="fill: #9e9e9e;">OWNER / ADMIN / MINGO AI</text>
</svg>
