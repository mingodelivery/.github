    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #767676; text-anchor: middle; font-weight: bold; }
    @media (prefers-color-scheme: dark) { .text { fill: #8b949e; } .val { fill: #c9d1d9; } }
  </style>
